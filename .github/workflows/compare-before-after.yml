name: Compare before and after custom image

on:
  workflow_dispatch:
    inputs:
      telemetry:
        description: Collect CPU, memory, disk, network, and process telemetry
        type: boolean
        default: false

permissions:
  contents: read

env:
  BENCHMARK_REPOSITORY: ${{ vars.BENCHMARK_REPOSITORY || 'llvm/llvm-project' }}

jobs:
  benchmark:
    name: Pin benchmark revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      resolve_seconds: ${{ steps.revision.outputs.elapsed_seconds }}

    steps:
      - name: Resolve benchmark HEAD
        id: revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_TOKEN || github.token }}
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $sha = gh api "repos/$env:BENCHMARK_REPOSITORY/commits/HEAD" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not $sha) {
            throw "Unable to resolve the benchmark repository HEAD."
          }
          $timer.Stop()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "elapsed_seconds=$($timer.Elapsed.TotalSeconds.ToString('0.00', [Globalization.CultureInfo]::InvariantCulture))" >> $env:GITHUB_OUTPUT
          Write-Host "Pinned $env:BENCHMARK_REPOSITORY at $sha."

  before:
    name: Before - windows-latest
    needs: benchmark
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      tooling_seconds: ${{ steps.tooling_timing.outputs.elapsed_seconds }}
      checkout_seconds: ${{ steps.checkout_timing.outputs.elapsed_seconds }}
      checkout_action_seconds: ${{ steps.checkout_timing.outputs.elapsed_seconds }}
      sql_seconds: ${{ steps.sql_timing.outputs.elapsed_seconds }}
      total_seconds: ${{ steps.total_timing.outputs.elapsed_seconds }}
      workload_seconds: ${{ steps.workload.outputs.elapsed_seconds }}
      commit_sha: ${{ steps.workload.outputs.commit_sha }}
      tracked_files: ${{ steps.workload.outputs.tracked_files }}

    steps:
      - name: Start tooling checkout timer
        shell: pwsh
        run: |
          [System.Diagnostics.Stopwatch]::GetTimestamp() |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\tooling-start.txt"

      - name: Check out the example tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: example-source

      - name: Record tooling checkout duration
        id: tooling_timing
        shell: pwsh
        run: |
          $start = [long](Get-Content -LiteralPath "$env:RUNNER_TEMP\tooling-start.txt")
          $ticks = [System.Diagnostics.Stopwatch]::GetTimestamp() - $start
          $seconds = [math]::Round(
            $ticks / [System.Diagnostics.Stopwatch]::Frequency,
            2
          )
          "elapsed_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Start optional runner telemetry
        if: ${{ inputs.telemetry }}
        uses: tsviz/actions-runner-telemetry@c15eb88c652d9a26a572438a0d1b8c10af782e2e # v1

      - name: Start total timer
        shell: pwsh
        run: |
          [System.Diagnostics.Stopwatch]::GetTimestamp() |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\total-start.txt"
          [System.Diagnostics.Stopwatch]::GetTimestamp() |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\checkout-start.txt"

      - name: Check out the complete benchmark monorepo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BENCHMARK_REPOSITORY }}
          token: ${{ secrets.BENCHMARK_TOKEN || github.token }}
          ref: ${{ needs.benchmark.outputs.sha }}
          fetch-depth: 0
          path: benchmark-source
          persist-credentials: false

      - name: Record cold checkout duration
        id: checkout_timing
        shell: pwsh
        run: |
          $start = [long](Get-Content -LiteralPath "$env:RUNNER_TEMP\checkout-start.txt")
          $ticks = [System.Diagnostics.Stopwatch]::GetTimestamp() - $start
          $seconds = [math]::Round(
            $ticks / [System.Diagnostics.Stopwatch]::Frequency,
            2
          )
          "elapsed_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Install and verify SQL Server
        id: sql_timing
        timeout-minutes: 135
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          ./example-source/scripts/Install-SqlServer.ps1
          ./example-source/scripts/Test-SqlServer.ps1 -CreateExampleDatabase
          $timer.Stop()
          $seconds = $timer.Elapsed.TotalSeconds.ToString(
            "0.00",
            [Globalization.CultureInfo]::InvariantCulture
          )
          "elapsed_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Record total before duration
        id: total_timing
        shell: pwsh
        run: |
          $start = [long](Get-Content -LiteralPath "$env:RUNNER_TEMP\total-start.txt")
          $ticks = [System.Diagnostics.Stopwatch]::GetTimestamp() - $start
          $seconds = [math]::Round(
            $ticks / [System.Diagnostics.Stopwatch]::Frequency,
            2
          )
          "elapsed_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Execute Git and SQL dependent workload
        id: workload
        shell: pwsh
        env:
          READY_SECONDS: ${{ steps.total_timing.outputs.elapsed_seconds }}
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $result = ./example-source/scripts/Invoke-ExampleWorkload.ps1 `
            -RepositoryPath "$env:GITHUB_WORKSPACE\benchmark-source" `
            -Scenario Before `
            -ReadySeconds ([double]$env:READY_SECONDS)
          $timer.Stop()

          "elapsed_seconds=$($timer.Elapsed.TotalSeconds.ToString('0.00', [Globalization.CultureInfo]::InvariantCulture))" >> $env:GITHUB_OUTPUT
          "commit_sha=$($result.CommitSha)" >> $env:GITHUB_OUTPUT
          "tracked_files=$($result.TrackedFiles)" >> $env:GITHUB_OUTPUT
          $result | Format-List

          $readySeconds = [double]$env:READY_SECONDS
          $readyMinutes = [math]::Floor($readySeconds / 60)
          $readyRemainder = $readySeconds - ($readyMinutes * 60)
          $readyRounded = [math]::Round($readyRemainder)
          if ($readyRounded -eq 60) {
            $readyMinutes++
            $readyRounded = 0
          }
          $readyDisplay = "$readyMinutes min $readyRounded sec"
          $workloadDisplay = $timer.Elapsed.TotalSeconds.ToString(
            "0.00",
            [Globalization.CultureInfo]::InvariantCulture
          )

          @"
          ## 🔴 Before · Standard `windows-latest`

          > ### Ready in $readyDisplay

          | Readiness proof | Result |
          |---|---:|
          | Pinned Git commit | ``$($result.CommitSha.Substring(0, 12))`` |
          | Tracked files | $($result.TrackedFiles.ToString("N0")) |
          | Git → SQL proof | ✅ Passed in ${workloadDisplay}s |

          <details>
          <summary>Commands executed</summary>

          ``````powershell
          git -C benchmark-source rev-parse HEAD
          git -C benchmark-source ls-files
          ./scripts/Invoke-ExampleWorkload.ps1
          ``````

          </details>
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Publish optional runner telemetry
        if: ${{ always() && inputs.telemetry }}
        uses: tsviz/actions-runner-telemetry@c15eb88c652d9a26a572438a0d1b8c10af782e2e # v1
        with:
          mode: stop

  after:
    name: After - custom image
    needs: benchmark
    runs-on: ${{ vars.CUSTOM_IMAGE_RUNNER || 'windows-monorepo-sqlserver-runner' }}
    timeout-minutes: 30
    outputs:
      tooling_seconds: ${{ steps.tooling_timing.outputs.elapsed_seconds }}
      cache_init_seconds: ${{ steps.initialize.outputs.elapsed_seconds }}
      checkout_seconds: ${{ steps.checkout_timing.outputs.elapsed_seconds }}
      checkout_action_seconds: ${{ steps.checkout_timing.outputs.action_seconds }}
      sql_seconds: ${{ steps.sql_timing.outputs.elapsed_seconds }}
      total_seconds: ${{ steps.total_timing.outputs.elapsed_seconds }}
      workload_seconds: ${{ steps.workload.outputs.elapsed_seconds }}
      commit_sha: ${{ steps.workload.outputs.commit_sha }}
      tracked_files: ${{ steps.workload.outputs.tracked_files }}

    steps:
      - name: Start tooling checkout timer
        shell: pwsh
        run: |
          [System.Diagnostics.Stopwatch]::GetTimestamp() |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\tooling-start.txt"

      - name: Check out the example tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: example-source

      - name: Record tooling checkout duration
        id: tooling_timing
        shell: pwsh
        run: |
          $start = [long](Get-Content -LiteralPath "$env:RUNNER_TEMP\tooling-start.txt")
          $ticks = [System.Diagnostics.Stopwatch]::GetTimestamp() - $start
          $seconds = [math]::Round(
            $ticks / [System.Diagnostics.Stopwatch]::Frequency,
            2
          )
          "elapsed_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Start optional runner telemetry
        if: ${{ inputs.telemetry }}
        uses: tsviz/actions-runner-telemetry@c15eb88c652d9a26a572438a0d1b8c10af782e2e # v1

      - name: Start timer and activate prepared worktree
        id: initialize
        shell: pwsh
        env:
          REMOTE_URL: ${{ github.server_url }}/${{ env.BENCHMARK_REPOSITORY }}
        run: |
          [System.Diagnostics.Stopwatch]::GetTimestamp() |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\total-start.txt"
          $elapsed = & ./example-source/scripts/Initialize-WarmCheckout.ps1 `
            -WorkspacePath "$env:GITHUB_WORKSPACE\benchmark-source" `
            -RemoteUrl $env:REMOTE_URL
          "elapsed_seconds=$elapsed" >> $env:GITHUB_OUTPUT
          [System.Diagnostics.Stopwatch]::GetTimestamp() |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\checkout-start.txt"

      - name: Check out the benchmark monorepo delta
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BENCHMARK_REPOSITORY }}
          token: ${{ secrets.BENCHMARK_TOKEN || github.token }}
          ref: ${{ needs.benchmark.outputs.sha }}
          fetch-depth: 0
          path: benchmark-source
          persist-credentials: false
          clean: false

      - name: Record warm checkout duration
        id: checkout_timing
        shell: pwsh
        env:
          INITIALIZE_SECONDS: ${{ steps.initialize.outputs.elapsed_seconds }}
        run: |
          $start = [long](Get-Content -LiteralPath "$env:RUNNER_TEMP\checkout-start.txt")
          $ticks = [System.Diagnostics.Stopwatch]::GetTimestamp() - $start
          $checkout = $ticks / [System.Diagnostics.Stopwatch]::Frequency
          $seconds = [math]::Round(
            [double]$env:INITIALIZE_SECONDS + $checkout,
            2
          )
          "action_seconds=$([math]::Round($checkout, 2))" >> $env:GITHUB_OUTPUT
          "elapsed_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Verify preinstalled SQL Server
        id: sql_timing
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          ./example-source/scripts/Test-SqlServer.ps1 -CreateExampleDatabase
          $timer.Stop()
          $seconds = $timer.Elapsed.TotalSeconds.ToString(
            "0.00",
            [Globalization.CultureInfo]::InvariantCulture
          )
          "elapsed_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Record total after duration
        id: total_timing
        shell: pwsh
        run: |
          $start = [long](Get-Content -LiteralPath "$env:RUNNER_TEMP\total-start.txt")
          $ticks = [System.Diagnostics.Stopwatch]::GetTimestamp() - $start
          $seconds = [math]::Round(
            $ticks / [System.Diagnostics.Stopwatch]::Frequency,
            2
          )
          "elapsed_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Execute Git and SQL dependent workload
        id: workload
        shell: pwsh
        env:
          READY_SECONDS: ${{ steps.total_timing.outputs.elapsed_seconds }}
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $result = ./example-source/scripts/Invoke-ExampleWorkload.ps1 `
            -RepositoryPath "$env:GITHUB_WORKSPACE\benchmark-source" `
            -Scenario After `
            -ReadySeconds ([double]$env:READY_SECONDS)
          $timer.Stop()

          "elapsed_seconds=$($timer.Elapsed.TotalSeconds.ToString('0.00', [Globalization.CultureInfo]::InvariantCulture))" >> $env:GITHUB_OUTPUT
          "commit_sha=$($result.CommitSha)" >> $env:GITHUB_OUTPUT
          "tracked_files=$($result.TrackedFiles)" >> $env:GITHUB_OUTPUT
          $result | Format-List

          $readySeconds = [double]$env:READY_SECONDS
          $readyMinutes = [math]::Floor($readySeconds / 60)
          $readyRemainder = $readySeconds - ($readyMinutes * 60)
          $readyRounded = [math]::Round($readyRemainder)
          if ($readyRounded -eq 60) {
            $readyMinutes++
            $readyRounded = 0
          }
          $readyDisplay = "$readyMinutes min $readyRounded sec"
          $workloadDisplay = $timer.Elapsed.TotalSeconds.ToString(
            "0.00",
            [Globalization.CultureInfo]::InvariantCulture
          )

          @"
          ## 🟢 After · Custom image

          > ### Ready in $readyDisplay

          | Readiness proof | Result |
          |---|---:|
          | Pinned Git commit | ``$($result.CommitSha.Substring(0, 12))`` |
          | Tracked files | $($result.TrackedFiles.ToString("N0")) |
          | Git → SQL proof | ✅ Passed in ${workloadDisplay}s |

          <details>
          <summary>Commands executed</summary>

          ``````powershell
          git -C benchmark-source rev-parse HEAD
          git -C benchmark-source ls-files
          ./scripts/Invoke-ExampleWorkload.ps1
          ``````

          </details>
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Publish optional runner telemetry
        if: ${{ always() && inputs.telemetry }}
        uses: tsviz/actions-runner-telemetry@c15eb88c652d9a26a572438a0d1b8c10af782e2e # v1
        with:
          mode: stop

  comparison:
    name: Before versus after
    needs:
      - benchmark
      - before
      - after
    runs-on: ubuntu-latest
    env:
      BENCHMARK_REPOSITORY: ${{ vars.BENCHMARK_REPOSITORY || 'llvm/llvm-project' }}
      RESOLVE_SECONDS: ${{ needs.benchmark.outputs.resolve_seconds }}
      BEFORE_TOOLING: ${{ needs.before.outputs.tooling_seconds }}
      AFTER_TOOLING: ${{ needs.after.outputs.tooling_seconds }}
      AFTER_CACHE_INIT: ${{ needs.after.outputs.cache_init_seconds }}
      BEFORE_CHECKOUT: ${{ needs.before.outputs.checkout_seconds }}
      AFTER_CHECKOUT: ${{ needs.after.outputs.checkout_seconds }}
      BEFORE_CHECKOUT_ACTION: ${{ needs.before.outputs.checkout_action_seconds }}
      AFTER_CHECKOUT_ACTION: ${{ needs.after.outputs.checkout_action_seconds }}
      BEFORE_SQL: ${{ needs.before.outputs.sql_seconds }}
      AFTER_SQL: ${{ needs.after.outputs.sql_seconds }}
      BEFORE_TOTAL: ${{ needs.before.outputs.total_seconds }}
      AFTER_TOTAL: ${{ needs.after.outputs.total_seconds }}
      BEFORE_WORKLOAD: ${{ needs.before.outputs.workload_seconds }}
      AFTER_WORKLOAD: ${{ needs.after.outputs.workload_seconds }}
      BEFORE_COMMIT: ${{ needs.before.outputs.commit_sha }}
      AFTER_COMMIT: ${{ needs.after.outputs.commit_sha }}
      BEFORE_FILES: ${{ needs.before.outputs.tracked_files }}
      AFTER_FILES: ${{ needs.after.outputs.tracked_files }}

    steps:
      - name: Publish comparison
        shell: pwsh
        run: |
          $culture = [Globalization.CultureInfo]::InvariantCulture

          function Convert-ToSeconds {
            param([string]$Value)
            return [double]::Parse($Value, $culture)
          }

          function Format-Duration {
            param([double]$Seconds)
            $minutes = [math]::Floor($Seconds / 60)
            $remainder = $Seconds - ($minutes * 60)
            $secondsText = if ($Seconds -lt 10) {
              $remainder.ToString("0.00", $culture)
            } else {
              $rounded = [math]::Round($remainder)
              if ($rounded -eq 60) {
                $minutes++
                $rounded = 0
              }
              $rounded.ToString("0", $culture)
            }
            return "$minutes min $secondsText sec"
          }

          function Format-Delta {
            param([double]$Seconds)
            if ($Seconds -lt 0) {
              return "-$(Format-Duration ([math]::Abs($Seconds)))"
            }
            return Format-Duration $Seconds
          }

          function Get-Reduction {
            param(
              [double]$Before,
              [double]$After
            )
            if ($Before -le 0) {
              return 0
            }
            return [math]::Round((1 - ($After / $Before)) * 100, 1)
          }

          $resolveSeconds = Convert-ToSeconds $env:RESOLVE_SECONDS
          $beforeTooling = Convert-ToSeconds $env:BEFORE_TOOLING
          $afterTooling = Convert-ToSeconds $env:AFTER_TOOLING
          $afterCacheInit = Convert-ToSeconds $env:AFTER_CACHE_INIT
          $beforeCheckout = Convert-ToSeconds $env:BEFORE_CHECKOUT
          $afterCheckout = Convert-ToSeconds $env:AFTER_CHECKOUT
          $beforeCheckoutAction = Convert-ToSeconds $env:BEFORE_CHECKOUT_ACTION
          $afterCheckoutAction = Convert-ToSeconds $env:AFTER_CHECKOUT_ACTION
          $beforeSql = Convert-ToSeconds $env:BEFORE_SQL
          $afterSql = Convert-ToSeconds $env:AFTER_SQL
          $beforeTotal = Convert-ToSeconds $env:BEFORE_TOTAL
          $afterTotal = Convert-ToSeconds $env:AFTER_TOTAL
          $beforeWorkload = Convert-ToSeconds $env:BEFORE_WORKLOAD
          $afterWorkload = Convert-ToSeconds $env:AFTER_WORKLOAD

          $saved = [math]::Round($beforeTotal - $afterTotal, 2)
          $speedup = if ($afterTotal -gt 0) {
            [math]::Round($beforeTotal / $afterTotal, 1)
          } else {
            "n/a"
          }
          $percent = Get-Reduction $beforeTotal $afterTotal
          $checkoutSaved = [math]::Round($beforeCheckout - $afterCheckout, 2)
          $sqlSaved = [math]::Round($beforeSql - $afterSql, 2)
          $checkoutReduction = Get-Reduction $beforeCheckout $afterCheckout
          $sqlReduction = Get-Reduction $beforeSql $afterSql
          $beforeOverhead = [math]::Max(
            0,
            $beforeTotal - $beforeCheckout - $beforeSql
          )
          $afterOverhead = [math]::Max(
            0,
            $afterTotal - $afterCheckout - $afterSql
          )
          $beforeObserved = $beforeTooling + $beforeTotal + $beforeWorkload
          $afterObserved = $afterTooling + $afterTotal + $afterWorkload
          $headlineLabel = if ($saved -ge 0) { "TIME SAVED" } else { "TIME ADDED" }
          $headlineDuration = Format-Duration ([math]::Abs($saved))
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $runnerRate = 0.022
          $beforeBillableMinutes = [math]::Ceiling($beforeObserved / 60)
          $afterBillableMinutes = [math]::Ceiling($afterObserved / 60)
          $beforeEquivalentCost = $beforeBillableMinutes * $runnerRate
          $afterRunnerCost = $afterBillableMinutes * $runnerRate
          $computeSavings = $beforeEquivalentCost - $afterRunnerCost
          $capacityValue = [math]::Max(0, $saved / 3600 * 100)
          $computeSavingsText = '$' + $computeSavings.ToString("0.000", $culture)
          $afterRunnerCostText = '+$' + $afterRunnerCost.ToString("0.000", $culture)
          $capacityValueText = '$' + $capacityValue.ToString("0.00", $culture)
          $runnerRateText = '$' + $runnerRate.ToString("0.000", $culture)
          $engineeringRateText = '$100/hour'

          if ($env:BEFORE_COMMIT -ne $env:AFTER_COMMIT) {
            throw "Before and after used different benchmark commits."
          }
          if ($env:BEFORE_FILES -ne $env:AFTER_FILES) {
            throw "Before and after produced different tracked-file counts."
          }

          @"
          <div align="center">

          # ⚡ Custom Image: Before vs. After

          **$env:BENCHMARK_REPOSITORY** · ``$($env:BEFORE_COMMIT.Substring(0, 12))`` ·
          $(([int]$env:BEFORE_FILES).ToString("N0")) files ·
          [Run #$env:GITHUB_RUN_NUMBER]($runUrl)

          </div>

          <table>
          <tr>
          <td align="center">
          <strong>⏱️ $headlineLabel</strong>
          <h2>$headlineDuration</h2>
          </td>
          <td align="center">
          <strong>📉 LESS SETUP</strong>
          <h2>$percent%</h2>
          </td>
          <td align="center">
          <strong>⚡ FASTER</strong>
          <h2>${speedup}×</h2>
          </td>
          <td align="center">
          <strong>💵 4-CORE COMPUTE SAVED</strong>
          <h2>$computeSavingsText</h2>
          </td>
          </tr>
          </table>

          ## 🏁 Result

          | | 🔴 Standard `windows-latest` | 🟢 Custom image | Improvement |
          |---|---:|---:|---:|
          | Git checkout | $(Format-Duration $beforeCheckout) | **$(Format-Duration $afterCheckout)** | $checkoutReduction% |
          | SQL Server ready | $(Format-Duration $beforeSql) | **$(Format-Duration $afterSql)** | $sqlReduction% |
          | **Ready for work** | **$(Format-Duration $beforeTotal)** | **$(Format-Duration $afterTotal)** | **$(Format-Delta $saved)** |

          ``````mermaid
          flowchart LR
              Before["🔴 Cold setup<br/>$(Format-Duration $beforeTotal)"]
              Saved["⚡ Save $headlineDuration"]
              After["🟢 Ready<br/>$(Format-Duration $afterTotal)"]
              Before --> Saved --> After
              classDef before fill:#ffebe9,color:#82071e,stroke:#cf222e,stroke-width:2px
              classDef saved fill:#ddf4ff,color:#0550ae,stroke:#0969da,stroke-width:3px
              classDef after fill:#dafbe1,color:#116329,stroke:#1a7f37,stroke-width:2px
              class Before before
              class Saved saved
              class After after
          ``````

          ## 💵 Economics per run

          | Lens | Value | Meaning |
          |---|---:|---|
          | Same Windows 4-core larger runner | **$computeSavingsText saved** | $beforeBillableMinutes billed min → $afterBillableMinutes billed min at $runnerRateText/min |
          | This public demo | **$afterRunnerCostText** | Standard runner is free; custom larger runner is billed |
          | Engineering capacity at $engineeringRateText | **$capacityValueText recovered** | Assumes the entire saved wait blocked one developer |

          > Compute estimate only. Image-build compute and custom-image storage
          > are excluded. ✅ Both jobs verified the same Git commit, file count,
          > and Git → SQL workload.

          <details>
          <summary><strong>Full timing, proof, and methodology</strong></summary>

          Benchmark revision resolution: **$(Format-Duration $resolveSeconds)**

          | Workflow phase | 🔴 Before | 🟢 Custom image |
          |---|---:|---:|
          | Tooling checkout | $(Format-Duration $beforeTooling) | $(Format-Duration $afterTooling) |
          | Prepared worktree activation | — | $(Format-Duration $afterCacheInit) |
          | Repository checkout action | $(Format-Duration $beforeCheckoutAction) | $(Format-Duration $afterCheckoutAction) |
          | SQL Server readiness | $(Format-Duration $beforeSql) | $(Format-Duration $afterSql) |
          | Timing bookkeeping | $(Format-Duration $beforeOverhead) | $(Format-Duration $afterOverhead) |
          | Git → SQL proof | $(Format-Duration $beforeWorkload) | $(Format-Duration $afterWorkload) |
          | **Observed workflow path** | **$(Format-Duration $beforeObserved)** | **$(Format-Duration $afterObserved)** |

          **Correctness evidence**

          - Commit: ``$env:BEFORE_COMMIT``
          - Tracked files: $(([int]$env:BEFORE_FILES).ToString("N0")) on both runners
          - Prepared worktree and object store accepted by `actions/checkout`
          - Git metadata inserted into and queried back from SQL Server

          **Methodology**

          - Both jobs check out the same pinned commit with full history.
          - The timer starts immediately before repository setup.
          - Time-to-ready ends after SQL Server answers a query.
          - The proof workload runs after the timer and validates both dependencies.
          - Runner queue and VM provisioning time are excluded.
          - GitHub's internal **Set up job** and post-action cleanup remain
            visible in the native job timeline but are outside the instrumented
            workflow path above.

          </details>

          "@ >> $env:GITHUB_STEP_SUMMARY
