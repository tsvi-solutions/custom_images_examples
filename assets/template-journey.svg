<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Four steps for adopting this custom-image template</title>
  <desc id="desc">Configure the repository and runners, build and snapshot the warm environment, consume the latest image, then prove the before-and-after result and monitor it with a canary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c1538"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#a371f7" opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#background)"/>
  <rect width="1200" height="390" rx="28" fill="url(#dots)"/>
  <text x="600" y="48" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="middle">FROM REPOSITORY TO PROVEN WARM START</text>
  <text x="600" y="76" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle" letter-spacing="1.5">A REPEATABLE FOUR-STAGE ADOPTION PATH</text>

  <rect x="125" y="142" width="950" height="8" rx="4" fill="#30363d"/>
  <rect x="125" y="142" width="950" height="8" rx="4" fill="url(#line)" filter="url(#glow)"/>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="55" y="104" width="245" height="220" rx="22" fill="#111f35" stroke="#1f6feb" stroke-width="2"/>
    <circle cx="177.5" cy="146" r="32" fill="#1f6feb" stroke="#79c0ff" stroke-width="2"/>
    <text x="177.5" y="156" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">1</text>
    <text x="177.5" y="205" fill="#f0f6fc" font-size="20" font-weight="800" text-anchor="middle">CONFIGURE</text>
    <text x="177.5" y="233" fill="#8b949e" font-size="13" text-anchor="middle">Repository + runner groups</text>
    <path d="M149 265H206M157 257V281M198 257V281" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="91" y="296" width="173" height="24" rx="12" fill="#1f6feb" opacity="0.17"/>
    <text x="177.5" y="312" fill="#79c0ff" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">SET THE FOUNDATION</text>

    <rect x="337" y="104" width="245" height="220" rx="22" fill="#221a36" stroke="#8250df" stroke-width="2"/>
    <circle cx="459.5" cy="146" r="32" fill="#8250df" stroke="#c8b6ff" stroke-width="2"/>
    <text x="459.5" y="156" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">2</text>
    <text x="459.5" y="205" fill="#f0f6fc" font-size="20" font-weight="800" text-anchor="middle">BUILD</text>
    <text x="459.5" y="233" fill="#8b949e" font-size="13" text-anchor="middle">Install + seed + snapshot</text>
    <path d="M442 259L459 249L476 259V279L459 289L442 279Z" fill="none" stroke="#a371f7" stroke-width="2.5"/>
    <path d="M442 259L459 269L476 259M459 269V289" fill="none" stroke="#a371f7" stroke-width="2.5"/>
    <rect x="373" y="296" width="173" height="24" rx="12" fill="#8250df" opacity="0.17"/>
    <text x="459.5" y="312" fill="#c8b6ff" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">CREATE THE WARM LAYER</text>

    <rect x="619" y="104" width="245" height="220" rx="22" fill="#142534" stroke="#168e98" stroke-width="2"/>
    <circle cx="741.5" cy="146" r="32" fill="#168e98" stroke="#39c5cf" stroke-width="2"/>
    <text x="741.5" y="156" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">3</text>
    <text x="741.5" y="205" fill="#f0f6fc" font-size="20" font-weight="800" text-anchor="middle">CONSUME</text>
    <text x="741.5" y="233" fill="#8b949e" font-size="13" text-anchor="middle">Select image version Latest</text>
    <path d="M720 269H761M750 258L762 269L750 280" fill="none" stroke="#39c5cf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="655" y="296" width="173" height="24" rx="12" fill="#168e98" opacity="0.17"/>
    <text x="741.5" y="312" fill="#56d4dd" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">START EVERY JOB READY</text>

    <rect x="901" y="104" width="245" height="220" rx="22" fill="#15261a" stroke="#238636" stroke-width="2"/>
    <circle cx="1023.5" cy="146" r="32" fill="#238636" stroke="#56d364" stroke-width="2"/>
    <text x="1023.5" y="156" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">4</text>
    <text x="1023.5" y="205" fill="#f0f6fc" font-size="20" font-weight="800" text-anchor="middle">PROVE</text>
    <text x="1023.5" y="233" fill="#8b949e" font-size="13" text-anchor="middle">Before + after + canary</text>
    <path d="M1007 270L1018 281L1040 257" fill="none" stroke="#56d364" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="937" y="296" width="173" height="24" rx="12" fill="#238636" opacity="0.17"/>
    <text x="1023.5" y="312" fill="#56d364" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">MEASURE + KEEP HEALTHY</text>
  </g>

  <text x="600" y="362" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle" letter-spacing="0.9">CUSTOMIZE THE SOFTWARE · PRESERVE THE VALIDATION PATTERN · PUBLISH YOUR OWN RESULT</text>
</svg>
