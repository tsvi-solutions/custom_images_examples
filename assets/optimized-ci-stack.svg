<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">The strongest monorepo design combines custom images, a graph-aware build system, and GitHub Actions</title>
  <desc id="desc">Custom images optimize where work starts. A graph-aware build system optimizes what work runs. Both feed GitHub Actions, which orchestrates, proves, and reports the result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="actions" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#30363d" stroke-width="1" opacity="0.24"/>
    </pattern>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#58a6ff"/>
    </marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d29922"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="45" r="170" fill="#8250df" opacity="0.09"/>

  <text x="600" y="48" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="middle">START READY. RUN ONLY WHAT CHANGED.</text>
  <text x="600" y="76" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle" letter-spacing="1.3">THREE COMPLEMENTARY LAYERS · ONE MANAGED CI EXPERIENCE</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="55" y="124" width="320" height="190" rx="24" fill="#111f35" stroke="#1f6feb" stroke-width="2"/>
    <rect x="82" y="146" width="142" height="27" rx="13.5" fill="#1f6feb" opacity="0.22"/>
    <text x="153" y="164" fill="#58a6ff" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">WHERE WORK STARTS</text>
    <circle cx="105" cy="218" r="30" fill="#1f6feb" opacity="0.25"/>
    <path d="M88 210L105 200L122 210V230L105 240L88 230Z" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
    <path d="M88 210L105 220L122 210M105 220V240" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
    <text x="151" y="211" fill="#f0f6fc" font-size="21" font-weight="800">CUSTOM IMAGE</text>
    <text x="151" y="237" fill="#8b949e" font-size="14">Tools · Services · Workspace</text>
    <rect x="82" y="268" width="266" height="28" rx="14" fill="#0d1117" stroke="#1f6feb" opacity="0.9"/>
    <text x="215" y="287" fill="#79c0ff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">ENVIRONMENT READY</text>

    <rect x="440" y="124" width="320" height="190" rx="24" fill="#2b2415" stroke="#d29922" stroke-width="2"/>
    <rect x="467" y="146" width="142" height="27" rx="13.5" fill="#9e6a03" opacity="0.35"/>
    <text x="538" y="164" fill="#e3b341" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">WHAT WORK RUNS</text>
    <circle cx="490" cy="218" r="30" fill="#9e6a03" opacity="0.3"/>
    <circle cx="480" cy="207" r="4" fill="#e3b341"/>
    <circle cx="503" cy="217" r="4" fill="#e3b341"/>
    <circle cx="484" cy="231" r="4" fill="#e3b341"/>
    <path d="M484 209L499 215M501 220L487 229M481 211L483 227" stroke="#e3b341" stroke-width="2.5"/>
    <text x="536" y="211" fill="#f0f6fc" font-size="21" font-weight="800">BUILD SYSTEM</text>
    <text x="536" y="237" fill="#8b949e" font-size="14">Graph · Cache · Affected targets</text>
    <rect x="467" y="268" width="266" height="28" rx="14" fill="#0d1117" stroke="#9e6a03" opacity="0.9"/>
    <text x="600" y="287" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">ONLY NECESSARY WORK</text>
  </g>

  <path d="M375 219H411" stroke="#58a6ff" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M760 219H796" stroke="#d29922" stroke-width="4" marker-end="url(#goldArrow)"/>
  <circle cx="409" cy="219" r="13" fill="#0d1117" stroke="#58a6ff"/>
  <text x="409" y="225" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">+</text>
  <circle cx="791" cy="219" r="13" fill="#0d1117" stroke="#d29922"/>
  <text x="791" y="225" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">+</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="825" y="106" width="320" height="226" rx="28" fill="url(#actions)" stroke="#56d364" stroke-width="2.5"/>
    <circle cx="985" cy="158" r="28" fill="#ffffff" opacity="0.16" filter="url(#glow)"/>
    <path d="M972 158L982 168L1000 147" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="985" y="210" fill="#ffffff" font-size="23" font-weight="900" text-anchor="middle">GITHUB ACTIONS</text>
    <text x="985" y="238" fill="#ffffff" opacity="0.85" font-size="13" text-anchor="middle" letter-spacing="1">ORCHESTRATE · PROVE · REPORT</text>
    <rect x="866" y="268" width="78" height="30" rx="15" fill="#ffffff" opacity="0.15"/>
    <rect x="946" y="268" width="78" height="30" rx="15" fill="#ffffff" opacity="0.15"/>
    <rect x="1026" y="268" width="78" height="30" rx="15" fill="#ffffff" opacity="0.15"/>
    <text x="905" y="288" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CHECKS</text>
    <text x="985" y="288" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PROOF</text>
    <text x="1065" y="288" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">RESULTS</text>
  </g>

  <rect x="310" y="359" width="580" height="45" rx="22.5" fill="#161b22" stroke="#3fb950"/>
  <circle cx="341" cy="381.5" r="8" fill="#3fb950"/>
  <text x="616" y="387" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.7">FAST START + INTELLIGENT EXECUTION + GITHUB-NATIVE GOVERNANCE</text>
</svg>
