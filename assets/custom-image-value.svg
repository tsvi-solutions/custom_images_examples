<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Stop paying the setup tax on every workflow run</title>
  <desc id="desc">Without a custom image, every run spends runner time and money cloning and materializing a repository, installing SDKs, SQL Server, browsers and compilers, restoring packages, generating files, and configuring certificates, paths, services and policies. A custom image captures that software and workspace preparation before the job. Each run then validates the image, loads its current workflow inputs, and starts productive work with less setup time, lower runner cost, and faster feedback.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="coldHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#da3633"/>
      <stop offset="1" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="warmHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="warmOutcome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#238636"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.22"/>
    </pattern>
    <marker id="coldArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f85149"/>
    </marker>
    <marker id="warmArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3fb950"/>
    </marker>
    <marker id="neutralArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#background)"/>
  <rect width="1200" height="860" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="70" r="190" fill="#8250df" opacity="0.08"/>
  <circle cx="100" cy="800" r="220" fill="#1f6feb" opacity="0.07"/>

  <text x="600" y="48" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="1">STOP PAYING THE SETUP TAX</text>
  <text x="600" y="78" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle" letter-spacing="1.6">MOVE SOFTWARE + WORKSPACE PREPARATION OUT OF EVERY RUN</text>

  <rect x="502" y="102" width="196" height="38" rx="19" fill="#21262d" stroke="#6e7681"/>
  <circle cx="527" cy="121" r="8" fill="#a371f7" filter="url(#glow)"/>
  <text x="610" y="126" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.2">EVERY CODE CHANGE</text>
  <path d="M540 140C490 154 410 156 315 173" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#neutralArrow)"/>
  <path d="M660 140C710 154 790 156 885 173" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#neutralArrow)"/>

  <g filter="url(#shadow)">
    <rect x="55" y="172" width="520" height="642" rx="24" fill="#161b22" stroke="#6e2c2b" stroke-width="2"/>
    <path d="M79 172H551A24 24 0 0 1 575 196V244H55V196A24 24 0 0 1 79 172Z" fill="url(#coldHeader)"/>
    <circle cx="94" cy="208" r="16" fill="#ffffff" opacity="0.16"/>
    <path d="M86 208H102M94 200V216" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="124" y="203" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">WITHOUT CUSTOM IMAGE</text>
    <text x="124" y="226" fill="#ffffff" opacity="0.84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1">EVERY SETUP TASK RUNS AGAIN</text>
  </g>

  <path d="M315 290V608" fill="none" stroke="#f85149" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="112" y="264" width="406" height="86" rx="17" fill="#21262d" stroke="#6e2c2b"/>
    <circle cx="149" cy="307" r="19" fill="#f85149" opacity="0.18"/>
    <path d="M140 301H158M140 307H155M140 313H152" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
    <text x="181" y="292" fill="#f0f6fc" font-size="16" font-weight="800">1 · CLONE + MATERIALIZE</text>
    <text x="181" y="317" fill="#8b949e" font-size="12">Full history · large workspace</text>
    <text x="181" y="336" fill="#8b949e" font-size="12">Submodules · dependencies · generated indexes</text>
    <rect x="411" y="276" width="91" height="24" rx="12" fill="#3a1d20" stroke="#f85149"/>
    <text x="456.5" y="293" fill="#ff7b72" font-size="10" font-weight="800" text-anchor="middle">TIME + $</text>

    <rect x="112" y="370" width="406" height="96" rx="17" fill="#21262d" stroke="#6e2c2b"/>
    <circle cx="149" cy="418" r="19" fill="#f85149" opacity="0.18"/>
    <path d="M140 418L146 424L158 410" fill="none" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="181" y="398" fill="#f0f6fc" font-size="16" font-weight="800">2 · INSTALL TOOLS + SERVICES</text>
    <text x="181" y="424" fill="#8b949e" font-size="12">SDKs · SQL Server · browsers · compilers</text>
    <text x="181" y="444" fill="#8b949e" font-size="12">CLIs · native libraries · scanners · emulators</text>
    <rect x="411" y="382" width="91" height="24" rx="12" fill="#3a1d20" stroke="#f85149"/>
    <text x="456.5" y="399" fill="#ff7b72" font-size="10" font-weight="800" text-anchor="middle">TIME + $</text>

    <rect x="112" y="486" width="406" height="108" rx="17" fill="#21262d" stroke="#6e2c2b"/>
    <circle cx="149" cy="540" r="19" fill="#f85149" opacity="0.18"/>
    <path d="M140 540H158M149 531V549" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
    <text x="181" y="514" fill="#f0f6fc" font-size="16" font-weight="800">3 · PREPARE WORKSPACE</text>
    <text x="181" y="540" fill="#8b949e" font-size="12">Restore packages · generate files · seed databases</text>
    <text x="181" y="560" fill="#8b949e" font-size="12">Certificates · PATH · services · policies</text>
    <text x="181" y="580" fill="#8b949e" font-size="12">Create directories · configure local tooling</text>
    <rect x="411" y="498" width="91" height="24" rx="12" fill="#3a1d20" stroke="#f85149"/>
    <text x="456.5" y="515" fill="#ff7b72" font-size="10" font-weight="800" text-anchor="middle">TIME + $</text>

    <rect x="198" y="612" width="234" height="44" rx="22" fill="#30363d" stroke="#8b949e"/>
    <text x="315" y="640" fill="#f0f6fc" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.3">START PRODUCTIVE WORK</text>
  </g>

  <text x="315" y="676" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.2">THREE SETUP BILLS · ON EVERY RUN</text>
  <rect x="105" y="686" width="420" height="96" rx="20" fill="#2d1719" stroke="#f85149" stroke-width="2"/>
  <text x="175" y="715" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">SETUP TIME</text>
  <text x="175" y="750" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="900" text-anchor="middle">MORE</text>
  <path d="M245 706V763M385 706V763" stroke="#6e2c2b"/>
  <text x="315" y="715" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">RUNNER COST</text>
  <text x="315" y="750" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="900" text-anchor="middle">MORE</text>
  <text x="455" y="715" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">FEEDBACK</text>
  <text x="455" y="750" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="900" text-anchor="middle">SLOWER</text>
  <path d="M105 734C26 734 26 307 105 307" fill="none" stroke="#f85149" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#coldArrow)"/>
  <rect x="12" y="505" width="108" height="28" rx="14" fill="#2d1719" stroke="#6e2c2b"/>
  <text x="66" y="524" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">PAY AGAIN</text>

  <g filter="url(#shadow)">
    <rect x="625" y="172" width="520" height="642" rx="24" fill="#161b22" stroke="#2b6f3b" stroke-width="2"/>
    <path d="M649 172H1121A24 24 0 0 1 1145 196V244H625V196A24 24 0 0 1 649 172Z" fill="url(#warmHeader)"/>
    <circle cx="664" cy="208" r="16" fill="#ffffff" opacity="0.16"/>
    <path d="M656 208L662 214L674 200" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="694" y="203" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">WITH CUSTOM IMAGE</text>
    <text x="694" y="226" fill="#ffffff" opacity="0.84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1">SETUP CAPTURED BEFORE THE JOB</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="682" y="264" width="406" height="226" rx="20" fill="#12261a" stroke="#2ea043" stroke-width="2"/>
    <rect x="830" y="278" width="110" height="25" rx="12.5" fill="#1c4928" stroke="#3fb950"/>
    <text x="885" y="295" fill="#7ee787" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">BUILT ONCE</text>
    <circle cx="730" cy="328" r="22" fill="#238636" opacity="0.3"/>
    <path d="M718 321L730 314L742 321V335L730 342L718 335Z" fill="none" stroke="#56d364" stroke-width="2.2"/>
    <path d="M718 321L730 328L742 321M730 328V342" fill="none" stroke="#56d364" stroke-width="2.2"/>
    <text x="765" y="321" fill="#f0f6fc" font-size="16" font-weight="800">READY INSIDE THE IMAGE</text>
    <text x="765" y="343" fill="#7ee787" font-size="11">The same setup is already captured and validated</text>

    <circle cx="718" cy="378" r="10" fill="#238636"/>
    <path d="M713 378L717 382L724 374" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="383" fill="#c9d1d9" font-size="13">Repository workspace + dependencies</text>
    <circle cx="718" cy="418" r="10" fill="#238636"/>
    <path d="M713 418L717 422L724 414" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="423" fill="#c9d1d9" font-size="13">SDKs + services + browsers + compilers</text>
    <circle cx="718" cy="458" r="10" fill="#238636"/>
    <path d="M713 458L717 462L724 454" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="463" fill="#c9d1d9" font-size="13">Workspace configuration + policies</text>

    <path d="M885 490V512" stroke="#3fb950" stroke-width="4"/>
    <rect x="682" y="512" width="194" height="62" rx="17" fill="#15261a" stroke="#2ea043"/>
    <circle cx="711" cy="543" r="16" fill="#238636" opacity="0.3"/>
    <path d="M703 543L709 549L719 536" fill="none" stroke="#56d364" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="736" y="539" fill="#f0f6fc" font-size="14" font-weight="800">Validate</text>
    <text x="736" y="557" fill="#7ee787" font-size="10">Fresh + healthy</text>

    <path d="M876 543H892" stroke="#3fb950" stroke-width="3" marker-end="url(#warmArrow)"/>
    <rect x="894" y="512" width="194" height="62" rx="17" fill="#15261a" stroke="#2ea043"/>
    <circle cx="923" cy="543" r="16" fill="#238636" opacity="0.3"/>
    <path d="M915 543H929M925 537L931 543L925 549" fill="none" stroke="#56d364" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="948" y="539" fill="#f0f6fc" font-size="14" font-weight="800">Load run inputs</text>
    <text x="948" y="557" fill="#7ee787" font-size="10">Code + configuration</text>

    <path d="M885 574V610" stroke="#3fb950" stroke-width="4"/>
    <rect x="768" y="610" width="234" height="44" rx="22" fill="#1f6feb" stroke="#58a6ff" filter="url(#glow)"/>
    <text x="885" y="638" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.3">START PRODUCTIVE WORK</text>
  </g>

  <text x="885" y="676" fill="#56d364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.2">ONE IMAGE BUILD · SAVINGS ON EVERY RUN</text>
  <rect x="675" y="686" width="420" height="96" rx="20" fill="url(#warmOutcome)" stroke="#58a6ff" stroke-width="2"/>
  <text x="745" y="715" fill="#ffffff" opacity="0.84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">SETUP TIME</text>
  <text x="745" y="750" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="900" text-anchor="middle">LESS</text>
  <path d="M815 706V763M955 706V763" stroke="#ffffff" opacity="0.24"/>
  <text x="885" y="715" fill="#ffffff" opacity="0.84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">RUNNER COST</text>
  <text x="885" y="750" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="900" text-anchor="middle">LESS</text>
  <text x="1025" y="715" fill="#ffffff" opacity="0.84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">FEEDBACK</text>
  <text x="1025" y="750" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="900" text-anchor="middle">FASTER</text>
  <path d="M1095 734C1174 734 1174 376 1095 376" fill="none" stroke="#3fb950" stroke-width="4" marker-end="url(#warmArrow)"/>
  <rect x="1078" y="505" width="108" height="28" rx="14" fill="#15261a" stroke="#2b6f3b"/>
  <text x="1132" y="524" fill="#56d364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">REUSE</text>

  <text x="600" y="838" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" letter-spacing="0.8">GITHUB-MANAGED FOUNDATION  ·  YOUR VALIDATED SOFTWARE  ·  READY FOR THE NEXT CHANGE</text>
</svg>
