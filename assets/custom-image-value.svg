<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Custom images create faster and less expensive feedback loops</title>
  <desc id="desc">A side-by-side comparison. Without a custom image, each code change repeats cloning, installation, and configuration. With a custom image, each change starts from a ready image, validates freshness, and fetches only the delta. The custom-image path uses less setup time and runner spend and creates faster feedback.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="coldHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#da3633"/>
      <stop offset="1" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="warmHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="warmOutcome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#238636"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.22"/>
    </pattern>
    <marker id="coldArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f85149"/>
    </marker>
    <marker id="warmArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3fb950"/>
    </marker>
    <marker id="neutralArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#background)"/>
  <rect width="1200" height="760" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="70" r="180" fill="#8250df" opacity="0.08"/>
  <circle cx="110" cy="700" r="220" fill="#1f6feb" opacity="0.07"/>

  <text x="600" y="52" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="1">BUILD ONCE. MOVE FASTER.</text>
  <text x="600" y="82" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle" letter-spacing="2">THE BUSINESS IMPACT OF A PRE-WARMED RUNNER</text>

  <rect x="502" y="104" width="196" height="38" rx="19" fill="#21262d" stroke="#6e7681"/>
  <circle cx="527" cy="123" r="8" fill="#a371f7" filter="url(#glow)"/>
  <text x="610" y="128" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.2">EVERY CODE CHANGE</text>
  <path d="M540 142C500 156 420 158 320 174" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#neutralArrow)"/>
  <path d="M660 142C700 156 780 158 880 174" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#neutralArrow)"/>

  <g filter="url(#shadow)">
    <rect x="65" y="174" width="500" height="520" rx="24" fill="#161b22" stroke="#6e2c2b" stroke-width="2"/>
    <path d="M89 174H541A24 24 0 0 1 565 198V238H65V198A24 24 0 0 1 89 174Z" fill="url(#coldHeader)"/>
    <circle cx="104" cy="206" r="15" fill="#ffffff" opacity="0.16"/>
    <path d="M97 206H111M104 199V213" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="132" y="202" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">WITHOUT CUSTOM IMAGE</text>
    <text x="132" y="222" fill="#ffffff" opacity="0.78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1">REBUILD THE STARTING ENVIRONMENT</text>
  </g>

  <path d="M315 268V482" fill="none" stroke="#f85149" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="128" y="254" width="374" height="58" rx="16" fill="#21262d" stroke="#6e2c2b"/>
    <circle cx="164" cy="283" r="18" fill="#f85149" opacity="0.18"/>
    <path d="M155 278H173M155 284H169M155 290H165" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
    <text x="194" y="288" fill="#f0f6fc" font-size="17" font-weight="700">Clone and materialize</text>

    <rect x="128" y="330" width="374" height="58" rx="16" fill="#21262d" stroke="#6e2c2b"/>
    <circle cx="164" cy="359" r="18" fill="#f85149" opacity="0.18"/>
    <path d="M156 359L162 365L173 352" fill="none" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="194" y="364" fill="#f0f6fc" font-size="17" font-weight="700">Install tools and services</text>

    <rect x="128" y="406" width="374" height="58" rx="16" fill="#21262d" stroke="#6e2c2b"/>
    <circle cx="164" cy="435" r="18" fill="#f85149" opacity="0.18"/>
    <path d="M155 435H173M164 426V444" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
    <text x="194" y="440" fill="#f0f6fc" font-size="17" font-weight="700">Configure the workspace</text>

    <rect x="198" y="482" width="234" height="44" rx="22" fill="#30363d" stroke="#8b949e"/>
    <text x="315" y="510" fill="#f0f6fc" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.4">START PRODUCTIVE WORK</text>
  </g>

  <rect x="108" y="550" width="414" height="108" rx="20" fill="#2d1719" stroke="#f85149" stroke-width="2"/>
  <text x="177" y="580" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">TIME</text>
  <text x="177" y="615" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" text-anchor="middle">MORE</text>
  <path d="M246 572V636M384 572V636" stroke="#6e2c2b"/>
  <text x="315" y="580" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">RUNNER SPEND</text>
  <text x="315" y="615" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" text-anchor="middle">MORE</text>
  <text x="453" y="580" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">FEEDBACK</text>
  <text x="453" y="615" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" text-anchor="middle">SLOWER</text>
  <path d="M108 604C30 604 30 286 108 286" fill="none" stroke="#f85149" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#coldArrow)"/>
  <rect x="18" y="420" width="105" height="28" rx="14" fill="#2d1719" stroke="#6e2c2b"/>
  <text x="70" y="439" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">REPEAT SETUP</text>

  <g filter="url(#shadow)">
    <rect x="635" y="174" width="500" height="520" rx="24" fill="#161b22" stroke="#2b6f3b" stroke-width="2"/>
    <path d="M659 174H1111A24 24 0 0 1 1135 198V238H635V198A24 24 0 0 1 659 174Z" fill="url(#warmHeader)"/>
    <circle cx="674" cy="206" r="15" fill="#ffffff" opacity="0.16"/>
    <path d="M666 206L672 212L683 199" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="702" y="202" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">WITH CUSTOM IMAGE</text>
    <text x="702" y="222" fill="#ffffff" opacity="0.78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1">REUSE A VALIDATED STARTING ENVIRONMENT</text>
  </g>

  <path d="M885 268V482" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="698" y="254" width="374" height="58" rx="16" fill="#15261a" stroke="#2ea043"/>
    <circle cx="734" cy="283" r="18" fill="#3fb950" opacity="0.18"/>
    <path d="M724 278L734 273L744 278V289L734 294L724 289Z" fill="none" stroke="#56d364" stroke-width="2.2"/>
    <path d="M724 278L734 283L744 278M734 283V294" fill="none" stroke="#56d364" stroke-width="2.2"/>
    <text x="764" y="288" fill="#f0f6fc" font-size="17" font-weight="700">Start from the warm image</text>

    <rect x="698" y="330" width="374" height="58" rx="16" fill="#15261a" stroke="#2ea043"/>
    <circle cx="734" cy="359" r="18" fill="#3fb950" opacity="0.18"/>
    <path d="M726 359L732 365L743 352" fill="none" stroke="#56d364" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="764" y="364" fill="#f0f6fc" font-size="17" font-weight="700">Validate freshness</text>

    <rect x="698" y="406" width="374" height="58" rx="16" fill="#15261a" stroke="#2ea043"/>
    <circle cx="734" cy="435" r="18" fill="#3fb950" opacity="0.18"/>
    <path d="M726 435H742M738 429L744 435L738 441" fill="none" stroke="#56d364" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="764" y="440" fill="#f0f6fc" font-size="17" font-weight="700">Fetch only the delta</text>

    <rect x="768" y="482" width="234" height="44" rx="22" fill="#1f6feb" stroke="#58a6ff" filter="url(#glow)"/>
    <text x="885" y="510" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.4">START PRODUCTIVE WORK</text>
  </g>

  <rect x="678" y="550" width="414" height="108" rx="20" fill="url(#warmOutcome)" stroke="#58a6ff" stroke-width="2"/>
  <text x="747" y="580" fill="#ffffff" opacity="0.82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">TIME</text>
  <text x="747" y="615" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" text-anchor="middle">LESS</text>
  <path d="M816 572V636M954 572V636" stroke="#ffffff" opacity="0.24"/>
  <text x="885" y="580" fill="#ffffff" opacity="0.82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">RUNNER SPEND</text>
  <text x="885" y="615" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" text-anchor="middle">LESS</text>
  <text x="1023" y="580" fill="#ffffff" opacity="0.82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">FEEDBACK</text>
  <text x="1023" y="615" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" text-anchor="middle">FASTER</text>
  <path d="M1092 604C1170 604 1170 286 1092 286" fill="none" stroke="#3fb950" stroke-width="4" marker-end="url(#warmArrow)"/>
  <rect x="1077" y="420" width="105" height="28" rx="14" fill="#15261a" stroke="#2b6f3b"/>
  <text x="1129" y="439" fill="#56d364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">REUSE SETUP</text>

  <text x="600" y="728" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" letter-spacing="0.8">GITHUB-MANAGED FOUNDATION  ·  YOUR VALIDATED SOFTWARE  ·  READY FOR THE NEXT CHANGE</text>
</svg>
