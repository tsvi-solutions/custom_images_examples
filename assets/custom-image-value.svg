    <text x="482" y="288" fill="#ff7b72" font-size="23" font-weight="900" text-anchor="middle">$</text>

    <rect x="105" y="338" width="410" height="76" rx="18" fill="#21262d" stroke="#6e2c2b"/>
    <circle cx="153" cy="376" r="25" fill="#3a1d20"/>
    <path d="M141 387L165 363M142 363L165 386M138 371L147 362M160 387L169 378" fill="none" stroke="#ff7b72" stroke-width="3" stroke-linecap="round"/>
    <text x="192" y="382" fill="#f0f6fc" font-size="18" font-weight="800">TOOLS</text>
    <circle cx="430" cy="376" r="22" fill="#3a1d20" stroke="#f85149"/>
    <circle cx="430" cy="376" r="12" fill="none" stroke="#ff7b72" stroke-width="2.5"/>
    <path d="M430 376V367M430 376L437 380" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="482" cy="376" r="22" fill="#3a1d20" stroke="#f85149"/>
    <text x="482" y="384" fill="#ff7b72" font-size="23" font-weight="900" text-anchor="middle">$</text>

    <rect x="105" y="434" width="410" height="76" rx="18" fill="#21262d" stroke="#6e2c2b"/>
    <circle cx="153" cy="472" r="25" fill="#3a1d20"/>
    <path d="M140 463H166M140 472H166M140 481H166M147 459V467M159 468V476M151 477V485" fill="none" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
    <text x="192" y="478" fill="#f0f6fc" font-size="18" font-weight="800">WORKSPACE</text>
    <circle cx="430" cy="472" r="22" fill="#3a1d20" stroke="#f85149"/>
    <circle cx="430" cy="472" r="12" fill="none" stroke="#ff7b72" stroke-width="2.5"/>
    <path d="M430 472V463M430 472L437 476" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="482" cy="472" r="22" fill="#3a1d20" stroke="#f85149"/>
    <text x="482" y="480" fill="#ff7b72" font-size="23" font-weight="900" text-anchor="middle">$</text>
  </g>

  <path d="M105 571C24 571 24 280 88 280" fill="none" stroke="#f85149" stroke-width="3.5" stroke-dasharray="9 8" marker-end="url(#redArrow)"/>
  <circle cx="52" cy="418" r="18" fill="#2d1719" stroke="#f85149"/>
  <path d="M43 418A10 10 0 1 1 51 427M51 427V419M51 427H43" fill="none" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="182" y="537" width="256" height="48" rx="24" fill="#30363d" stroke="#8b949e"/>
  <path d="M216 553L230 561L216 569Z" fill="#c9d1d9"/>
  <text x="320" y="567" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="1">WORK</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="213" cy="616" r="21" fill="#3a1d20" stroke="#f85149"/>
    <circle cx="213" cy="616" r="11" fill="none" stroke="#ff7b72" stroke-width="2.5"/>
    <path d="M213 616V608M213 616L220 620" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M242 626L254 614L266 626" fill="none" stroke="#f85149" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="321" cy="616" r="21" fill="#3a1d20" stroke="#f85149"/>
    <text x="321" y="624" fill="#ff7b72" font-size="23" font-weight="900" text-anchor="middle">$</text>
    <path d="M350 626L362 614L374 626" fill="none" stroke="#f85149" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="429" cy="616" r="21" fill="#3a1d20" stroke="#f85149"/>
    <path d="M419 616A10 10 0 1 1 427 625M427 625V617M427 625H419" fill="none" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M458 607L470 619L482 607" fill="none" stroke="#f85149" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="150" width="520" height="495" rx="26" fill="#161b22" stroke="#2b6f3b" stroke-width="2"/>
    <path d="M656 150H1124A26 26 0 0 1 1150 176V220H630V176A26 26 0 0 1 656 150Z" fill="url(#warm)"/>
    <circle cx="670" cy="185" r="17" fill="#ffffff" opacity="0.17"/>
    <path d="M661 185L668 192L681 177" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="702" y="183" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900">WITH CUSTOM IMAGE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="252" width="380" height="220" rx="35" fill="url(#capsule)" stroke="#3fb950" stroke-width="3"/>
    <path d="M700 310Q890 230 1080 310" fill="none" stroke="#56d364" stroke-width="2" opacity="0.45"/>
    <path d="M890 267L908 274V287C908 300 900 308 890 312C880 308 872 300 872 287V274Z" fill="#1c4928" stroke="#3fb950" stroke-width="2"/>
