    <path d="M761 354H799M761 365H793M761 376H787" stroke="#7ee787" stroke-width="4" stroke-linecap="round"/>

    <circle cx="890" cy="365" r="48" fill="#1c4928" stroke="#3fb950"/>
    <path d="M870 380L910 340M870 340L910 380M864 353L879 338M901 387L916 372" fill="none" stroke="#7ee787" stroke-width="4" stroke-linecap="round"/>

    <circle cx="1000" cy="365" r="48" fill="#1c4928" stroke="#3fb950"/>
    <path d="M977 350H1023M977 365H1023M977 380H1023M988 343V357M1011 358V372M994 373V387" fill="none" stroke="#7ee787" stroke-width="3.5" stroke-linecap="round"/>

    <path d="M780 421H1000" stroke="#3fb950" stroke-width="2" opacity="0.5"/>
    <path d="M872 421L890 439L908 421" fill="#12261a" stroke="#3fb950" stroke-width="2"/>
