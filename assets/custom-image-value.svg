  <path d="M890 472V520" stroke="#3fb950" stroke-width="5" marker-end="url(#greenArrow)"/>
  <rect x="762" y="537" width="256" height="48" rx="24" fill="url(#work)" stroke="#58a6ff" filter="url(#glow)"/>
  <path d="M796 553L810 561L796 569Z" fill="#ffffff"/>
  <text x="900" y="567" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="1">WORK</text>

  <path d="M1080 571C1165 571 1165 365 1090 365" fill="none" stroke="#3fb950" stroke-width="4" marker-end="url(#greenArrow)"/>
  <circle cx="1134" cy="457" r="18" fill="#15261a" stroke="#3fb950"/>
  <path d="M1125 457A10 10 0 1 1 1133 466M1133 466V458M1133 466H1125" fill="none" stroke="#56d364" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

