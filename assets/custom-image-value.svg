<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Repeat setup every run or capture it once in a custom image</title>
  <desc id="desc">A visual comparison. Without a custom image, source preparation, software installation, and workspace configuration each consume time and runner cost before productive work begins, and the cycle repeats. With a custom image, those three layers are captured once inside a validated reusable image, so each run follows a short path to productive work with less time and cost and faster feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#161b22"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#da3633"/>
      <stop offset="1" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="work" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12261a"/>
      <stop offset="1" stop-color="#0f3020"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
    </pattern>
    <marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8b949e"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f85149"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="700" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="30" r="190" fill="#8250df" opacity="0.08"/>
  <circle cx="80" cy="670" r="170" fill="#1f6feb" opacity="0.07"/>

  <text x="600" y="48" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="1">MOVE SETUP OUT OF THE RUN</text>

  <rect x="535" y="72" width="130" height="48" rx="24" fill="#21262d" stroke="#6e7681" stroke-width="2"/>
  <path d="M575 88L559 96L575 104M625 88L641 96L625 104M611 83L590 109" fill="none" stroke="#c8b6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M560 120C505 135 420 136 325 153M640 120C695 135 780 136 875 153" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#grayArrow)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="150" width="520" height="495" rx="26" fill="#161b22" stroke="#6e2c2b" stroke-width="2"/>
    <path d="M76 150H544A26 26 0 0 1 570 176V220H50V176A26 26 0 0 1 76 150Z" fill="url(#cold)"/>
    <circle cx="90" cy="185" r="17" fill="#ffffff" opacity="0.17"/>
    <path d="M81 185H99M90 176V194" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="183" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900">WITHOUT CUSTOM IMAGE</text>
  </g>

  <path d="M310 267V480" fill="none" stroke="#f85149" stroke-width="3" stroke-dasharray="3 9"/>

