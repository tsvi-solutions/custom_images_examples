    <path d="M101 369L108 355L114 364L120 348L124 369Z" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="148" y="355" fill="#f0f6fc" font-size="16" font-weight="800">DATA + ML</text>
