    <circle cx="112" cy="258" r="23" fill="#1f6feb" opacity="0.25"/>
    <rect x="103" y="242" width="18" height="32" rx="3" fill="none" stroke="#58a6ff" stroke-width="2.2"/>
    <circle cx="112" cy="269" r="1.8" fill="#58a6ff"/>
    <text x="148" y="253" fill="#f0f6fc" font-size="16" font-weight="800">MOBILE + WEB</text>
    <text x="148" y="276" fill="#8b949e" font-size="13">SDKs · Browsers · Emulators</text>

