<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Where pre-warmed custom images create value</title>
  <desc id="desc">A custom image at the center connects to six workload categories: enterprise toolchains, mobile and browsers, data and machine learning, databases and services, large repositories, and security and infrastructure.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="0.55" stop-color="#8250df"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#58a6ff" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <rect width="1200" height="520" rx="28" fill="url(#dots)"/>
  <text x="600" y="50" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="middle">ONE WARM LAYER. MANY WORKLOADS.</text>
  <text x="600" y="78" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle" letter-spacing="1.4">CAPTURE LARGE · STABLE · DETERMINISTIC SETUP</text>

  <g fill="none" stroke-linecap="round">
    <path d="M510 212C430 178 395 163 340 156" stroke="#a371f7" stroke-width="2.5" opacity="0.65"/>
    <path d="M500 258C420 258 390 258 340 258" stroke="#58a6ff" stroke-width="2.5" opacity="0.65"/>
    <path d="M510 304C430 338 395 353 340 360" stroke="#3fb950" stroke-width="2.5" opacity="0.65"/>
    <path d="M690 212C770 178 805 163 860 156" stroke="#f778ba" stroke-width="2.5" opacity="0.65"/>
    <path d="M700 258C780 258 810 258 860 258" stroke="#d29922" stroke-width="2.5" opacity="0.65"/>
    <path d="M690 304C770 338 805 353 860 360" stroke="#39c5cf" stroke-width="2.5" opacity="0.65"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="112" width="270" height="88" rx="18" fill="#1b1f2a" stroke="#8250df" stroke-width="2"/>
    <circle cx="112" cy="156" r="23" fill="#8250df" opacity="0.25"/>
    <path d="M102 147H122V165H102ZM107 142H117V147H107Z" fill="none" stroke="#a371f7" stroke-width="2.2"/>
    <text x="148" y="151" fill="#f0f6fc" font-size="16" font-weight="800">ENTERPRISE</text>
    <text x="148" y="174" fill="#8b949e" font-size="13">Toolchains · Legacy SDKs</text>

