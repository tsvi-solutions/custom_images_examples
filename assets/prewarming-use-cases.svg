    <circle cx="902" cy="156" r="23" fill="#bf3989" opacity="0.25"/>
    <ellipse cx="902" cy="147" rx="12" ry="5" fill="none" stroke="#f778ba" stroke-width="2.2"/>
    <path d="M890 147V165C890 168 895 171 902 171S914 168 914 165V147M890 156C890 159 895 162 902 162S914 159 914 156" fill="none" stroke="#f778ba" stroke-width="2.2"/>
    <text x="938" y="151" fill="#f0f6fc" font-size="16" font-weight="800">DATA SERVICES</text>
    <text x="938" y="174" fill="#8b949e" font-size="13">Databases · Local services</text>

    <rect x="860" y="214" width="270" height="88" rx="18" fill="#1b1f2a" stroke="#9e6a03" stroke-width="2"/>
    <circle cx="902" cy="258" r="23" fill="#9e6a03" opacity="0.25"/>
    <circle cx="894" cy="249" r="4" fill="none" stroke="#d29922" stroke-width="2"/>
    <circle cx="910" cy="267" r="4" fill="none" stroke="#d29922" stroke-width="2"/>
    <circle cx="910" cy="249" r="4" fill="none" stroke="#d29922" stroke-width="2"/>
    <path d="M898 249H906M897 252L907 264" stroke="#d29922" stroke-width="2"/>
    <text x="938" y="253" fill="#f0f6fc" font-size="16" font-weight="800">REPOSITORIES</text>
    <text x="938" y="276" fill="#8b949e" font-size="13">Git mirrors · Workspaces</text>

    <rect x="860" y="316" width="270" height="88" rx="18" fill="#1b1f2a" stroke="#168e98" stroke-width="2"/>
    <circle cx="902" cy="360" r="23" fill="#168e98" opacity="0.25"/>
    <path d="M902 345L914 350V359C914 367 909 372 902 375C895 372 890 367 890 359V350Z" fill="none" stroke="#39c5cf" stroke-width="2.2"/>
    <path d="M897 359L901 363L908 355" fill="none" stroke="#39c5cf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="938" y="355" fill="#f0f6fc" font-size="16" font-weight="800">SECURITY + INFRA</text>
    <text x="938" y="378" fill="#8b949e" font-size="13">Scanners · CLIs · Providers</text>
  </g>

  <g filter="url(#glow)">
    <path d="M600 125L690 177V281L600 333L510 281V177Z" fill="url(#core)" stroke="#c8b6ff" stroke-width="2"/>
  </g>
  <path d="M557 207L600 182L643 207V257L600 282L557 257Z" fill="#ffffff" opacity="0.13" stroke="#ffffff" stroke-width="2"/>
  <path d="M557 207L600 232L643 207M600 232V282" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="600" y="306" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">CUSTOM IMAGE</text>

  <rect x="392" y="435" width="416" height="48" rx="24" fill="#161b22" stroke="#58a6ff"/>
  <circle cx="425" cy="459" r="8" fill="#3fb950"/>
  <text x="615" y="464" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.6">REMOVE EVERY REPEATABLE SETUP PATH AT ONCE</text>
</svg>
